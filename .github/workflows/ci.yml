name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Lint check
        run: uv run ruff check src tests

      - name: Type check
        run: uv run ty check src

      # data/raw/*.jsonl is gitignored, so the suite must not depend on it.
      - name: Run tests with coverage
        run: uv run pytest --doctest-modules --cov=parlamonitor --cov-report=term-missing
