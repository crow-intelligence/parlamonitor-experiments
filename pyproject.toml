[project]
name = "parlamonitor"
version = "0.1.0"
description = "Analysis of Hungarian parliamentary transcripts (cycle 43 exports)"
readme = "README.md"
authors = [
    { name = "Zoltan Varju", email = "zoltan.varju@crowintelligence.org" },
]
requires-python = ">=3.12"

# This is an analysis workspace, not a library for release: no PyPI
# classifiers, keywords, or publish workflow. The `src/parlamonitor` package
# exists so loaders and metrics are importable and testable from notebooks and
# scripts alike, rather than copy-pasted between them.
dependencies = [
    # Crow packages, from PyPI. saphes and keyflux are the two that map
    # directly onto this data; kenon and lexograph are here because trying
    # them on it is the point of the workspace.
    "saphes>=0.1",
    "keyflux>=0.2",
    "kenon>=0.1.2",
    "lexograph>=0.1",
    "pandas>=2.2",
    # Upper bound is numba's, not ours: numba 0.66 requires numpy<2.5, and
    # bertopic reaches it through umap-learn -> pynndescent -> numba. Without
    # the bound uv backtracks numba to a release whose llvmlite predates
    # Python 3.10 and the resolution fails outright.
    "numpy>=1.26,<2.5",
    "matplotlib>=3.8",
    # Imported directly by parlamonitor.interactions for the heckling network.
    # It arrives transitively through kenon, but a direct import deserves a
    # direct declaration.
    "networkx>=3.0",
]

[project.optional-dependencies]
# Only relevant once the archive cycles (39-42) are exported alongside 43.
diachronic = [
    "chronowords>=0.3",
]
# Task 2: unsupervised topic modeling. Kept out of the base install because
# bertopic drags in umap-learn, hdbscan and numba.
topics = [
    "bertopic>=0.16",
    "sentence-transformers>=3.0",
    # 4.3.3 is the first release that stopped calling scipy.linalg.triu, which
    # scipy removed in 1.13. The environment has scipy 1.18.
    "gensim>=4.3.3",
    "scikit-learn>=1.4",
    "requests>=2.31",
]
# Tasks 5-6: readability, affect and keyword extraction over the speeches.
# Out of the base install for the same reason as `topics`: keybert reaches
# sentence-transformers and transformers reaches torch, which together are
# larger than everything else here put together. saphes itself is in the core.
metrics = [
    "keybert>=0.9",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "torch>=2.0",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "ty",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D102", "D103", "D104", "ANN"]
"scripts/**" = ["D100", "D103", "ANN"]
"notebooks/**" = ["D100", "D103", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "--doctest-modules --tb=short"
testpaths = ["src", "tests"]

[tool.ty]
